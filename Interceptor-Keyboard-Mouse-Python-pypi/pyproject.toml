[build-system]
requires = ["setuptools>=77", "wheel>=0.43"]
build-backend = "setuptools.build_meta"
[project]
name = "interceptor-keyboard-mouse"
version = "1.0.0"
description = "Direct Windows x64 Interceptor-Keyboard-Mouse input SDK with native receive, edit, send, descriptors and cancellation"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
[project.urls]
Repository = "https://github.com/TitanCSA/Interceptor-Keyboard-Mouse"
Documentation = "https://github.com/TitanCSA/Interceptor-Keyboard-Mouse/tree/main/Interceptor-Keyboard-Mouse-Python-pypi/docs"
[tool.setuptools]
packages = ["interceptor_keyboard_mouse"]
[tool.setuptools.package-data]
interceptor_keyboard_mouse = ["InterceptorKeyboardMouseBridge.dll"]
[tool.setuptools.data-files]
"share/doc/interceptor-keyboard-mouse" = ["docs/API.md", "examples/info.py", "LICENSE"]
